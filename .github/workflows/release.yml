name: Release

# Кожен пуш у main збирає модуль у zip і публікує GitHub Release.
# Версія береться з skyservice/config.xml. Якщо тег vX.Y.Z уже існує
# (версію не підняли) — реліз іде під тегом vX.Y.Z-build.N, щоб жоден пуш не загубився.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP syntax check
        run: |
          php -v | head -1
          find skyservice -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Resolve version
        id: version
        run: |
          XML_VERSION=$(sed -n 's/.*<version><!\[CDATA\[\(.*\)\]\]><\/version>.*/\1/p' skyservice/config.xml)
          PHP_VERSION=$(sed -n "s/.*\$this->version = '\(.*\)';.*/\1/p" skyservice/skyservice.php)

          if [ -z "$XML_VERSION" ]; then
            echo "::error file=skyservice/config.xml::version not found"
            exit 1
          fi
          if [ "$XML_VERSION" != "$PHP_VERSION" ]; then
            echo "::error::version mismatch: config.xml=$XML_VERSION, skyservice.php=$PHP_VERSION"
            exit 1
          fi

          TAG="v$XML_VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG="v$XML_VERSION-build.$GITHUB_RUN_NUMBER"
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          echo "version=$XML_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (previous: ${PREV_TAG:-none})"

      - name: Build zip
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          # PrestaShop очікує в архіві кореневу теку з імʼям модуля
          zip -r -X "dist/skyservice-$TAG.zip" skyservice -x '*.DS_Store' -x '*/.gitkeep'
          # Стабільне імʼя — для посилання releases/latest/download/skyservice.zip
          cp "dist/skyservice-$TAG.zip" dist/skyservice.zip
          unzip -l dist/skyservice.zip

      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.version.outputs.prev_tag }}
        run: |
          {
            echo "## SkyService для PrestaShop $TAG"
            echo
            echo "**Встановлення:** завантажте \`skyservice.zip\` і відкрийте в адмінці магазину"
            echo "*Модулі → Менеджер модулів → Завантажити модуль*."
            echo
            echo "### Зміни"
            if [ -n "$PREV_TAG" ]; then
              git log "$PREV_TAG..HEAD" --no-merges --pretty='- %s (%h)'
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            "dist/skyservice-$TAG.zip" \
            dist/skyservice.zip \
            --target "$GITHUB_SHA" \
            --title "SkyService $TAG" \
            --notes-file dist/notes.md \
            --latest
