            background-repeat: repeat;
            background-size: cover;
            background-position: 50%,50%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: transparent;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out, float 6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            25% {
                transform: translateY(-10px) translateX(5px);
            }
            50% {
                transform: translateY(-5px) translateX(-5px);
            }
            75% {
                transform: translateY(-15px) translateX(3px);
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            color: #2d3748;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        p {
            color: #4a5568;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #d4edda;
            color: #155724;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .status::before {
            content: "●";
            color: #28a745;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
        }
    </style>
</head>

    <div class="container">
        <h1 id="title">Your service is ready</h1>
        <p id="description">To manage, go to the developer cabinet</p>
    </div>

    <script>
        const translations = {
            uk: {
                title: 'Ваш сервіс готовий до роботи',
                description: 'Для керування перейдіть до кабінету розробника',
                pageTitle: 'Сервіс готовий'
            },
            ru: {
                title: 'Ваш сервис готов к работе',
                description: 'Для управления перейдите в кабинет разработчика',
                pageTitle: 'Сервис готов'
            },
            en: {
                title: 'Your service is ready',
                description: 'To manage, go to the developer cabinet',
                pageTitle: 'Service Ready'
            }
        };

        function detectLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            const langCode = browserLang.split('-')[0].toLowerCase();

            return translations[langCode] ? langCode : 'en';
        }

        function setLanguage() {
            const lang = detectLanguage();
            const texts = translations[lang];

            document.documentElement.lang = lang;
            document.title = texts.pageTitle;
            document.getElementById('title').textContent = texts.title;
            document.getElementById('description').textContent = texts.description;
        }

        setLanguage();
    </script>
